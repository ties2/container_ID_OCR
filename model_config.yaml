# ============================================================
# Container ID OCR Pipeline – Master Configuration
# ============================================================

project:
  name: container-id-ocr
  version: "1.0.0"
  seed: 42

paths:
  raw_data:       data/01_raw
  interim_data:   data/02_interim
  processed_data: data/03_processed
  model_dir:      models/
  log_dir:        logs/

# ────────────────────────────────────────────────────────────
# Stage 1 – Detection  (YOLOv8 / RT-DETR)
# ────────────────────────────────────────────────────────────
detection:
  model: yolov8          # choices: yolov8 | rtdetr
  weights: models/detector_yolov8.pt
  input_size: [640, 640]
  confidence_threshold: 0.50
  iou_threshold: 0.45
  device: cuda           # cuda | cpu | mps
  half_precision: true   # FP16 inference
  classes: [plate]       # single-class detector

# ────────────────────────────────────────────────────────────
# Stage 2 – Preprocessing
# ────────────────────────────────────────────────────────────
preprocessing:
  target_height: 64        # CRNN expects fixed-height strip
  target_width: 512
  grayscale: true
  deskew:
    enabled: true
    max_angle_deg: 15
  clahe:
    enabled: true
    clip_limit: 2.0
    tile_grid_size: [8, 8]
  sharpen:
    enabled: true
    kernel_size: 3
    strength: 1.5
  normalize:
    mean: 0.5
    std: 0.5

# ────────────────────────────────────────────────────────────
# Stage 3 – Recognition  (CRNN or VLM)
# ────────────────────────────────────────────────────────────
recognition:
  backend: crnn              # choices: crnn | vlm
  weights: models/crnn_iso6346.pt

  crnn:
    cnn_backbone: resnet34
    rnn_hidden: 256
    rnn_layers: 2
    dropout: 0.1
    charset: "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"  # ISO 6346 charset

  vlm:
    model_id: "Qwen/Qwen2-VL-7B-Instruct"
    prompt: >
      Read the container ID from the image. Return only the ISO 6346
      code in the format AAAU 123456 7 (owner + category + serial + check digit).
    max_new_tokens: 20

  confidence_threshold: 0.90   # Gate threshold (Stage 5)
  beam_width: 5                # CTC beam search width

# ────────────────────────────────────────────────────────────
# Stage 4 – Post-processing (ISO 6346 validation)
# ────────────────────────────────────────────────────────────
postprocessing:
  iso6346_validation: true
  reject_on_checksum_fail: true
  # Numeric value map for check digit calculation
  # Letters skip multiples of 11 (11 → 12, 22 → 23, 33 → 34)
  char_value_map: auto   # computed at runtime

# ────────────────────────────────────────────────────────────
# Stage 5 – Confidence Gating
# ────────────────────────────────────────────────────────────
confidence_gate:
  commit_threshold: 0.90
  flag_threshold: 0.70      # between flag and commit → human review
  # reads below flag_threshold are discarded automatically
  human_review_queue: logs/human_review.jsonl

# ────────────────────────────────────────────────────────────
# Training
# ────────────────────────────────────────────────────────────
training:
  epochs: 50
  batch_size: 32
  learning_rate: 1.0e-3
  lr_scheduler: cosine
  warmup_epochs: 3
  optimizer: adamw
  weight_decay: 1.0e-4
  grad_clip: 5.0
  val_split: 0.15
  num_workers: 4
  augmentation:
    random_perspective: true
    random_brightness: 0.3
    random_contrast: 0.3
    gaussian_noise: 0.02
    motion_blur: true
